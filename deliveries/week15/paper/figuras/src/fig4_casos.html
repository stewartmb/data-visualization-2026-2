<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Casos de uso</title>
<style>
@page{size:181mm 40mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:181mm;height:40mm;background:#fff;font-family:"TeX Gyre Heros","Liberation Sans",Arial,sans-serif;color:#172d3b}
.row{display:flex;gap:1.2mm;width:181mm;height:40mm}
.p{position:relative;height:40mm;border:.5pt solid #8ea19e;border-radius:.8mm;overflow:hidden;background:#fff}
.p img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:1.2mm;top:1.2mm;background:#172d3b;color:#fff;font-size:7pt;font-weight:700;line-height:1;padding:1mm 1.5mm;border-radius:.7mm}
.key{position:absolute;right:1.2mm;bottom:1.2mm;background:rgba(255,255,255,.93);border:.4pt solid #8ea19e;border-radius:.7mm;padding:1mm 1.5mm;font-size:5.8pt;line-height:1.42}
.key i{display:inline-block;width:5mm;height:0;vertical-align:middle;margin-right:1mm;border-top:1.6pt solid}
</style></head><body>
<div class="row">
  <div class="p" style="width:41mm"><img src="c_avp_lun8.jpg"><div class="tag">(a) Avenue P · lunes 8:00</div></div>
  <div class="p" style="width:41mm"><img src="c_avp_vie17.jpg"><div class="tag">Viernes 17:00</div></div>
  <div class="p" style="width:34mm"><img src="c_evmapa.jpg"><div class="tag">(b) Episodio</div></div>
  <div class="p" style="width:61.4mm"><img src="c_evserie.jpg" style="object-fit:contain"></div>
</div>
</body></html>
